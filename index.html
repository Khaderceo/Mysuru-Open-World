<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mysuru Open World</title>
    <style>
      /* Minimal shell styling only. The loading screen and its progress reporting
         are implemented in T-1.7; HUD styling arrives with T-8.0 / T-10.5. */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14110e;
        color: #e8e0d4;
        font:
          14px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.5rem;
        text-align: center;
        background: #14110e;
      }
      #boot p {
        margin: 0;
        opacity: 0.6;
      }
      noscript {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 1rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="boot">
      <strong>Mysuru Open World</strong>
      <p id="boot-status">Loading…</p>
    </div>
    <noscript>
      <p>This game needs JavaScript and WebGL2. Please enable JavaScript and reload.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
