# The gate (TESTING_STRATEGY.md §1). Runs exactly what a contributor runs locally, so
# local and CI never disagree.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Both engines of the documented matrix (BROWSER_COMPATIBILITY.md §7). WebGL comes
      # from SwiftShader, so no GPU is needed.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # typecheck -> unit -> build -> static checks -> e2e smoke
      - run: npm run check

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
